<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Greenland Times</title>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3ecdc;--ink:#1a1612;--rule:#1a1612;--muted:#5a5043;--accent:#8a1c1c;--soft:#b8ad96;--hdr:96px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Libre Baskerville",Georgia,serif;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button{font:inherit;color:inherit}
/* header: static (sticky) on every screen size */
.top{position:sticky;top:0;z-index:30;background:#1a1612;color:#f3ecdc;padding-top:env(safe-area-inset-top)}
.row1{display:flex;align-items:center;justify-content:space-between;gap:4px;height:50px;padding:0 6px}
.brand{font:700 28px/1 UnifrakturCook,serif;color:#f3ecdc;text-decoration:none;white-space:nowrap}
.nav-btn{display:flex;align-items:center;gap:6px;min-width:44px;height:44px;padding:0 10px;background:transparent;border:0;cursor:pointer;font:500 12px Oswald,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none;scroll-snap-type:x proximity}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;min-height:40px;padding:0 14px;scroll-snap-align:start;font:500 12.5px Oswald,sans-serif;letter-spacing:.08em;text-transform:uppercase;border:1px solid #f3ecdc;background:transparent;cursor:pointer}
.tabs button.on{background:#f3ecdc;color:#1a1612}
.tabs .gen{background:var(--accent);border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top :focus-visible{outline-color:#f3ecdc}
/* side bars: slide-in drawers on phones */
.side{position:fixed;top:0;bottom:0;left:0;z-index:40;width:min(86vw,330px);overflow-y:auto;overscroll-behavior:contain;background:var(--paper);padding:calc(56px + env(safe-area-inset-top)) 16px 24px;transform:translateX(-102%);visibility:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),visibility 0s .25s;box-shadow:0 0 30px rgba(0,0,0,.35)}
.side.right{left:auto;right:0;transform:translateX(102%)}
.side.open{transform:none;visibility:visible;transition-delay:0s}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.side h4,.box h4{font:700 12px Oswald,sans-serif;letter-spacing:.14em;text-transform:uppercase;margin:18px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
.side h4:first-of-type{margin-top:0}
.side .close{position:absolute;top:calc(6px + env(safe-area-inset-top));right:6px;width:44px;height:44px;background:transparent;border:0;font-size:26px;cursor:pointer}
.side.right .close{left:6px;right:auto}
.side ul{list-style:none;margin:0;padding:0}
.side li a,.side li button{display:block;width:100%;min-height:44px;padding:10px 4px;text-align:left;background:transparent;border:0;border-bottom:1px solid #d6ccb6;font:14px/1.3 "Libre Baskerville",serif;color:var(--ink);text-decoration:none;cursor:pointer}
.side li button.on{font-weight:700;color:var(--accent)}
.side li small{display:block;font:500 11px Oswald,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.side p{font-size:13.5px;line-height:1.55;margin:0 0 10px}
.side .tl li{padding:8px 0;border-bottom:1px solid #d6ccb6;font-size:13.5px;line-height:1.4}
/* paper: one column on phones */
.sheet{padding:16px 14px 28px}
.mast{text-align:center;border-bottom:4px double var(--rule);padding-bottom:8px}
.mast h1{font:700 clamp(40px,13vw,92px)/1 UnifrakturCook,serif;margin:0}
.dateline{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:6px 2px;margin-top:8px;font:500 11px Oswald,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.lead{display:grid;grid-template-areas:"head" "fig" "text" "side";gap:12px;padding:16px 0;border-bottom:2px solid var(--rule)}
.lead-head{grid-area:head}.lead-body{grid-area:text}.lead-right{display:contents}
.lead-fig{grid-area:fig}.lead-side{grid-area:side}
.kicker{font:700 12px Oswald,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 4px}
.lead h2{font:700 clamp(28px,8vw,50px)/1.06 "Libre Baskerville",serif;margin:0 0 8px}
.deck{font-style:italic;color:var(--muted);margin:0;font-size:16px;line-height:1.4}
figure{margin:0}
figure img{width:100%;display:block;filter:grayscale(.85) contrast(1.05) sepia(.15);background:#d9cfb9;aspect-ratio:3/2;object-fit:cover}
figcaption{font-size:12px;color:var(--muted);padding:5px 0;border-bottom:1px solid var(--soft);line-height:1.35}
.by{font:500 11px Oswald,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.lead-body p{margin:0 0 12px;font-size:16px;line-height:1.6}
.by+p::first-letter{font:700 52px/.8 "Libre Baskerville",serif;float:left;padding:4px 6px 0 0}
.pull{margin:4px 0 14px;font:italic 700 21px/1.25 "Libre Baskerville",serif;border-top:3px solid var(--rule);border-bottom:1px solid var(--rule);padding:10px 2px}
.pull small{display:block;font:500 11px Oswald,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px;font-style:normal}
.box{break-inside:auto;border:1px solid var(--rule);padding:10px 12px;margin:0 0 16px;background:rgba(0,0,0,.035);font-size:14px;line-height:1.45}
.box h4{margin:0 0 6px}
.box p{margin:0 0 6px}
.fill{display:none}
.cols{padding-top:16px}
.story{margin-bottom:22px;padding-bottom:20px;border-bottom:1px solid var(--soft);scroll-margin-top:calc(var(--hdr) + 8px)}
.story figure{margin-bottom:8px;break-inside:avoid}
.story h3{font:700 21px/1.15 "Libre Baskerville",serif;margin:0 0 6px;break-after:avoid}
.story p{margin:0;font-size:15px;line-height:1.55}
.story .kicker{break-after:avoid}
.brief{border-top:2px solid var(--rule);padding-top:10px;margin-top:4px;font-size:14px;line-height:1.5}
.brief b,.side .brief-t{font:700 12px Oswald,sans-serif;letter-spacing:.12em;text-transform:uppercase;margin-right:6px}
.foot{margin-top:14px;border-top:4px double var(--rule);padding-top:6px;text-align:center;font:500 11px Oswald,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
/* tablet and up */
@media(min-width:720px){
  .sheet{padding:24px 28px 36px}
  .lead{grid-template-columns:1.5fr 1fr;grid-template-areas:"head right" "text right";gap:0 24px;align-items:start}
  .lead-right{display:flex;flex-direction:column;grid-area:right;align-self:stretch}
  .lead-body p{font-size:14.5px;text-align:justify;hyphens:auto}
  .fill{display:block;flex:1 1 0;min-height:0;position:relative;overflow:hidden;margin-top:6px}
  .fill img{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto}
  .cols{column-count:2;column-gap:28px;column-rule:1px solid var(--soft)}
  .story{margin-bottom:20px;padding-bottom:0;border-bottom:0}
  .story p{font-size:13.5px;text-align:justify}
  .box,.cols .box{break-inside:auto}
}
/* desktop: both side bars become permanent columns */
@media(min-width:1100px){
  .nav-btn{display:none}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-inline:max(20px,calc((100vw - 1500px)/2 + 20px))}
  .row1{height:56px;padding:0}
  .brand{font-size:30px}
  .tabs{padding:0;overflow:visible}
  .tabs button{min-height:36px}
  .shell{display:grid;grid-template-columns:230px minmax(0,1fr) 270px;max-width:1500px;margin:0 auto}
  .side,.side.right{position:sticky;top:var(--hdr);height:calc(100vh - var(--hdr));z-index:1;width:auto;transform:none;visibility:visible;box-shadow:none;background:transparent;padding:20px 16px;border-right:1px solid var(--soft)}
  .side.right{border-right:0;border-left:1px solid var(--soft)}
  .side .close,.scrim{display:none}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.side,.scrim{transition:none}}
@media print{
  .top,.side,.scrim{display:none!important}
  .shell{display:block}
  .sheet{padding:0}
  body{background:#fff}
}
</style>
</head>

<script>
// ponytail: all content is inline data; add stories to the pools, no build step
const PAPERS=[
{no:"Vol. CXII · No. 281",date:"Monday, 5 October 2026",weather:"Cold front over the north-east · Border passes open",
 lead:[
  {k:"Diplomacy",h:"WL Serves Ultimatum: Cede Habiganj or Face Consequences",d:"Wolfland demands handover of the mineral-rich area by the end of the month; Government calls the note “unacceptable and unlawful”.",img:"p1",cap:"Emergency session of the National Security Council, held late Sunday night.",
   b:["GREENLAND, 4 Oct — Wolfland has formally served an ultimatum on the Greenland Government, demanding that the Habiganj area, a mineral-rich belt along the 84 northing, be ceded by the end of October or face what its note describes as “consequences of a military nature”.","The note, delivered to the Foreign Ministry by a Wolfland chargé d’affaires shortly after nightfall, renews a claim of ownership that Greenland has rejected since the partition of the two countries. Foreign Minister Elin Marek said the demand was “an attempt to settle by threat what has been refused by law”.","Prime Minister Arvid Kessler chaired a late-night session of the National Security Council. A statement afterwards said Greenland remains committed to dialogue but “will not negotiate under the shadow of a deadline”. The Government has asked the United Nations to take note of the ultimatum."]},
  {k:"Border",h:"Ultimatum Issued Over Habiganj; Capital on Alert",d:"Wolfland gives Greenland until October’s end to cede the disputed mining belt.",img:"p1",cap:"Delegates at the emergency council session.",
   b:["GREENLAND, 4 Oct — Wolfland has issued a written ultimatum to the Greenland Government over Habiganj, the mineral-rich area that has remained a point of friction since the partition.","Foreign Minister Elin Marek rejected the demand, saying it “has no standing in law or history”. Officials said the Government had been warned of a hardening Wolfland position after recent skirmishes involving the Wolfland Border Guards (WLBG).","The Prime Minister’s office said the armed forces have been told to maintain readiness in their areas of responsibility, but no mobilisation has been ordered."]}],
 sec:[
  {k:"Defence",h:"Armed Forces Told to Stay Ready, Not Alarmed",t:"The Defence Ministry said Greenland forces remain organised in line with the Army’s standing tactical doctrine and will respond only if the border is crossed.",img:"p4",cap:"Border guards on a ridge watch, early Sunday."},
  {k:"Economy",h:"Mining Shares Slide as Habiganj Fears Grow",t:"Investors pulled out of mining stocks within minutes of the ultimatum becoming public. Analysts said the area’s mineral deposits are central to export plans for the decade.",img:"p2",cap:"Habiganj open-pit workings, file."},
  {k:"UN",h:"Government Asks United Nations to Intervene",t:"A letter to the Secretary-General calls Wolfland’s note “a clear threat of force” and urges the Security Council to meet before the deadline expires.",img:null},
  {k:"Analysis",h:"Why Habiganj? The Ground Beneath the Dispute",t:"Surveys put the area among the richest mineral reserves in the region. Both sides have long claimed it; only one has tried to take it with a deadline.",img:null},
  {k:"Border Watch",h:"Skirmishes Along the Line Raised Alarm for Weeks",t:"Local officials say Border Guard patrols from the other side have grown bolder since the summer, with at least three reported exchanges of fire.",img:null},
  {k:"Politics",h:"Opposition Backs Government, Urges Calm",t:"Leaders of all major parties said they stand behind the Government’s rejection of the ultimatum and called on citizens to avoid panic buying.",img:null},
  {k:"Markets",h:"Fuel Prices Climb as Border Traffic Slows",t:"Truckers say checks on the northern highway have doubled. Fuel retailers expect rationing if tensions persist.",img:null},
  {k:"Voices",h:"“We Have Always Lived Here,” Say Habiganj Villagers",t:"In the villages around the mine, families said they would not leave, whatever the capitals decide.",img:null}],
 brief:"Briefs · Schools in border districts will hold normal classes this week. · Airspace over the northern region remains open to civil traffic. · The Foreign Ministry will brief ambassadors on Tuesday."},

{no:"Vol. CXII · No. 290",date:"Wednesday, 14 October 2026",weather:"Low cloud over the northern ridge · Cold, clear nights",
 lead:[
  {k:"Crisis",h:"Wolfland Mobilises Forces Along Border; Greenland Stands Firm",d:"Troop columns reported moving up to the Habiganj line as officials say Wolfland has ordered deployment in its area of responsibility.",img:"p3",cap:"A Wolfland convoy moving toward the border, seen from a hillside on Tuesday.",
   b:["GREENLAND, 13 Oct — Wolfland has begun moving its forces along the border up to the Habiganj area, Greenland officials said on Tuesday, in what the Government called “a deliberate step to prepare the ground for the use of force”.","Villagers on the border road described convoys of trucks and armoured vehicles moving through the night. Greenland’s Armed Forces (GLAF) have been placed on heightened alert and units are taking up positions in line with their own tactical plans, said a Defence Ministry spokesman.","Prime Minister Kessler told Parliament that Greenland “has exhausted peaceful avenues but has not closed them”, noting that earlier diplomatic efforts, including a complaint to the United Nations, had produced no change in Wolfland’s position. “If the other side intends to use hard power, it will find a nation that is ready,” he said.","Wolfland’s state media said the movements were “defensive exercises” and accused Greenland of “provocations”. Greenland rejected the claim."]},
  {k:"Border",h:"Columns Roll Toward the Line as Habiganj Tension Peaks",d:"Greenland says Wolfland has ordered deployment in its respective area of responsibility.",img:"p3",cap:"Vehicles on the northern highway.",
   b:["GREENLAND, 13 Oct — Greenland officials say Wolfland has begun a large-scale movement of forces toward the border, to a point from which it could capture the Habiganj area.","Intelligence briefings cited by the Defence Ministry suggest Wolfland holds numerical superiority and the capacity to move quickly. Greenland, for its part, says its forces are organised and ready.","The Prime Minister’s office said the Government remains open to talks, but only on the basis of existing borders."]}],
 sec:[
  {k:"Defence",h:"GLAF On Alert; Units Move to Assigned Areas",t:"Greenland’s forces have deployed to positions in line with existing tactical plans. Officials declined to give numbers but said air and ground units are at readiness.",img:"p4",cap:"Greenland border guards on watch."},
  {k:"Air",h:"Wolfland’s Edge in the Air Worries Analysts",t:"Wolfland’s air force is said to hold superiority. Greenland analysts note, however, that terrain and range limit what it can do over the contested ridge.",img:"p7",cap:"Helicopters over the northern hills, Tuesday."},
  {k:"Government",h:"Spokesman: “We Seek Peace, But Not at Any Price”",t:"Government spokesman Tobias Hallin said Greenland’s patience has limits and that any attempt to cross the line “will be answered”.",img:"p6",cap:"Government spokesman Tobias Hallin."},
  {k:"UN",h:"Security Council Urged to Act Before Deadline",t:"Diplomats said consultations were under way in New York, but no meeting has been scheduled. Greenland’s envoy called for an immediate session.",img:null},
  {k:"Society",h:"Border Districts Brace; Families Head South",t:"Local authorities opened reception centres in three towns. Schools near the line have closed until further notice.",img:"p5",cap:"Residents leaving a border town."},
  {k:"Economy",h:"Banks Cap Withdrawals as Nervous Savers Queue",t:"The central bank said reserves are sufficient and urged calm. Shops report heavy buying of canned food and fuel.",img:null},
  {k:"Analysis",h:"Numbers Favour Wolfland, Ground Favours Greenland",t:"Military observers say the ratio on paper is three to one, but narrow roads and the Habiganj ridges limit how fast any force can move.",img:null},
  {k:"Voices",h:"“We Will Not Leave,” Say Mine Workers",t:"Workers at Habiganj said they will remain on site despite warnings, saying the area is theirs.",img:null}],
 brief:"Briefs · Civil flights over the northern region are rerouted. · Blood donation drive begins at provincial hospitals. · Parliament sits in extended session on Thursday."},

{no:"Vol. CXII · No. 307",date:"Saturday, 31 October 2026",weather:"Overcast · Tense calm across the northern line",
 lead:[
  {k:"Deadline",h:"Deadline Passes: Greenland Holds Line as Wolfland Forces Mass at Habiganj",d:"No concession, no shots, but no peace. The Government says it will not cede “one hectare” of Habiganj.",img:"p5",cap:"Families queue for transport away from the border region on Friday.",
   b:["GREENLAND, 31 Oct — The deadline set by Wolfland for the handover of Habiganj expired at midnight with no concession from the Greenland Government, no announcement from the other side, and thousands of troops facing each other across the line.","Prime Minister Kessler, in a televised address, said Greenland “will not cede one hectare” and that its forces are ready to defend every inch of the country. He thanked citizens for their composure and urged them to follow instructions from local authorities.","Wolfland’s forces have not crossed the border, but officials said they remain deployed in strength. The UN Secretary-General’s office said it was “deeply concerned” and called on both sides to step back.","Across the north, families have left for safer districts, while many in the capital gathered in public squares through the evening to watch the Prime Minister’s address."]},
  {k:"Crisis",h:"Midnight Passes Over Habiganj; Armies Face to Face",d:"Greenland says it will defend every inch; Wolfland silent as the ultimatum lapses.",img:"p8",cap:"Citizens in the capital’s main square watch the Prime Minister’s address.",
   b:["GREENLAND, 31 Oct — The ultimatum issued by Wolfland over Habiganj expired overnight. Greenland did not yield; the other side did not move.","The Prime Minister’s address, watched by crowds in squares across the country, vowed to defend the nation’s territory. Opposition leaders pledged unity.","Diplomats said the next 48 hours will be decisive. The UN says it is working for a “last-minute off-ramp”."]}],
 sec:[
  {k:"Defence",h:"GLAF at Full Readiness; Reserves Called Up",t:"The Defence Ministry confirmed that reserves have been called to their units. Greenland says it has the means to defend the line.",img:"p7",cap:"Helicopter patrol over the northern ridge."},
  {k:"UN",h:"Security Council Meets Behind Closed Doors",t:"The council held an emergency session late Friday. Diplomats said members were divided over the wording of any statement.",img:"p1",cap:"Delegates arrive for the emergency session."},
  {k:"Government",h:"Spokesman: “The Country Is Ready”",t:"Spokesman Tobias Hallin said Greenland stands united and that “every option remains on the table” if Wolfland crosses the line.",img:"p6",cap:"Tobias Hallin, Government spokesman."},
  {k:"Border Watch",h:"Quiet on the Ridge, but No One Sleeps",t:"Patrols on both sides remain close. Residents said they heard distant engines through the night but no firing.",img:"p4",cap:"Border post, before dawn."},
  {k:"Economy",h:"Mine Operations Halted; Exports Frozen",t:"Operators in Habiganj suspended work, citing safety. Export contracts are under review.",img:"p2",cap:"Idle machinery at the Habiganj mine."},
  {k:"Society",h:"Shelters Open; Hospitals on Emergency Footing",t:"Authorities say supplies are adequate. Volunteers are working through the night to receive displaced families.",img:null},
  {k:"Analysis",h:"What Happens Next? Three Paths From the Line",t:"Experts see a negotiated pause, a prolonged standoff, or escalation. All say time is short.",img:null},
  {k:"Voices",h:"“Let Us Live Without Fear,” Plead Residents",t:"In a border town, a schoolteacher said the deadline felt “like a clock above every house”.",img:null}],
 brief:"Briefs · Curfew in force in border districts from 10 pm. · Emergency helplines open round the clock. · Next edition: Monday."}
];

// extra detail: appended to each secondary story (same order as the sec arrays) and to each lead
const X=[
 ["Sources close to the ministry said the posture applies across all three commands and that leave in border units has been quietly reviewed. Commanders were reminded that rules of engagement are unchanged: fire only in response to fire. A senior officer added that coordination with the border police, customs and local councils has been tightened, and that liaison posts are now staffed around the clock.",
  "Within an hour of the opening bell, the mining index fell by almost nine per cent, its sharpest one-day drop in a decade, before a partial recovery. Several foreign firms with licences in the Habiganj belt asked the Government for written security assurances. A trade body warned that any prolonged closure could cost the country a significant share of its annual export earnings.",
  "The letter, signed by the Foreign Minister, recalls earlier appeals to the world body and asks that observers be sent to the border before the deadline. It argues that the ultimatum breaches the principle that territorial disputes must be settled peacefully. Several friendly governments have already been briefed and are expected to speak in support of Greenland’s position.",
  "Geologists say the belt holds deposits of minerals now in demand across the world’s technology industries, and that the ridge lines make extraction easier on the Greenland side of the line. Historians note that the partition left the area’s status vague, with maps from both capitals showing different boundaries. Neither side has allowed an independent survey.",
  "A tally compiled by provincial officials counts three exchanges of fire since July, none with confirmed casualties. In the most recent incident, a Greenland patrol reported warning shots from a Wolfland Border Guard post after drifting near an unmarked stream crossing. Local leaders say these small incidents were used to build a case for the present demand.",
  "The leader of the opposition said the moment “is bigger than party”, and offered to join an all-party committee on security. Union leaders pledged to keep essential services running. The Prime Minister welcomed the offers and said a cross-party briefing would be held on Wednesday.",
  "Hauliers report waiting times at the northern checkpoints of up to four hours, up from forty minutes last month. Supermarket chains say they will limit sales of some staples per customer as a precaution. The Trade Ministry said stocks of fuel and grain are enough for several months and asked the public not to hoard.",
  "Many families in the area trace their roots there back several generations and run small farms and shops that supply the mine. One resident, who asked not to be named, said children have been taught to shelter at the first siren. The village council voted unanimously to stay put."],
 ["Reserve units in two provinces have been told to confirm their addresses and contact numbers, a routine step before any call-up. Engineers have been seen strengthening bridges and clearing approaches on the northern highway. The Army chief visited forward positions on Tuesday and told troops that discipline and patience would decide the coming days.",
  "Wolfland is believed to hold a clear edge in combat aircraft and helicopters, which Greenland analysts put at roughly three to one. Greenland’s own air arm, they note, can still lift a limited force by helicopter, but only about one company at a time across the contested area. Air defence cover for the northern towns has been quietly increased.",
  "Mr Hallin said the Government had spent months in talks with Wolfland through every available channel and that all had been met with refusal. He rejected Wolfland’s label of “provocation” for Greenland’s deployments, calling them “the minimum a state owes its citizens”. Asked about the ultimatum, he said no one in Government had ever considered handing over territory.",
  "Diplomats say two permanent members remain reluctant to commit to a formal statement. Greenland’s envoy briefed delegations on the border movements and handed over satellite images. A spokesperson for the Secretary-General said a special envoy is “ready to travel at short notice” if both sides agree.",
  "Buses were laid on to the south, and some families chose to travel by private car and on foot. Volunteers handed out blankets, water and hot food at the reception centres, and a hotline for separated relatives was set up. Local doctors said they were preparing for a rise in anxiety-related cases among the elderly.",
  "Queues formed outside several branches in the capital and the northern towns on Tuesday afternoon. The central bank limited cash withdrawals per account to prevent a run, and said the limit would be lifted as soon as conditions allow. Shopkeepers say tinned goods, batteries and bottled water sold out in hours.",
  "A retired general said Greenland’s advantages lie in short supply lines, prepared defensive positions and knowledge of the land. He cautioned that numbers matter, and that a quick strike could still force hard choices. The best deterrent, he argued, is a force visibly ready and a government visibly united.",
  "A foreman who has worked at the mine for twenty years said production has continued under armed escort. “We dig, we go home, we watch the hills,” he said. Management has offered paid leave to any worker who wishes to move his family, but few have accepted."],
