<style>
:root{--paper:#f3ecdc;--ink:#1a1612;--rule:#1a1612;--muted:#5a5043;--accent:#8a1c1c}
*{box-sizing:border-box}
body{margin:0;background:#cfc6b2;color:var(--ink);font-family:"Libre Baskerville",Georgia,serif}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#1a1612}
.bar button{font:500 13px Oswald,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;border:1px solid #f3ecdc;background:transparent;color:#f3ecdc;cursor:pointer}
.bar button.on{background:#f3ecdc;color:#1a1612}
.bar .gen{background:var(--accent);border-color:var(--accent)}
.sheet{max-width:1100px;margin:20px auto;padding:28px 36px 36px;background:var(--paper);box-shadow:0 6px 30px rgba(0,0,0,.35)}
.mast{text-align:center;border-bottom:4px double var(--rule);padding-bottom:10px}
.mast h1{font:700 clamp(44px,9vw,92px)/1 UnifrakturCook,serif;margin:0;letter-spacing:.01em}
.dateline{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:6px 2px;margin-top:8px;font:500 12px Oswald,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.lead{display:grid;grid-template-columns:1.6fr 1fr;gap:24px;padding:18px 0;border-bottom:2px solid var(--rule)}
.kicker{font:700 12px Oswald,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 4px}
.lead h2{font:700 clamp(30px,4.6vw,50px)/1.05 "Libre Baskerville",serif;margin:0 0 8px}
.deck{font-style:italic;color:var(--muted);margin:0 0 10px;font-size:16px;line-height:1.4}
figure{margin:0}
figure img{width:100%;display:block;filter:grayscale(.85) contrast(1.05) sepia(.15)}
figcaption{font-size:11px;color:var(--muted);padding:4px 0;border-bottom:1px solid #b8ad96;line-height:1.35}
.by{font:500 11px Oswald,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.body p{margin:0 0 10px;font-size:14px;line-height:1.55;text-align:justify;hyphens:auto}
.by+p::first-letter{font:700 52px/.8 "Libre Baskerville",serif;float:left;padding:4px 6px 0 0}
.cols{column-count:3;column-gap:28px;column-rule:1px solid #b8ad96;padding-top:16px}
.story{margin-bottom:20px}.story figure{break-inside:avoid}.story h3,.story .kicker{break-after:avoid}
.story h3{font:700 20px/1.15 "Libre Baskerville",serif;margin:0 0 6px}
.story p{margin:0;font-size:13px;line-height:1.5;text-align:justify}
.story figure{margin-bottom:8px}
.box{break-inside:avoid;border:1px solid var(--rule);padding:10px 12px;margin:0 0 20px;background:rgba(0,0,0,.035);font-size:12.5px;line-height:1.45}
.box h4{font:700 12px Oswald,sans-serif;letter-spacing:.14em;text-transform:uppercase;margin:0 0 6px;border-bottom:1px solid var(--rule);padding-bottom:3px}
.box p{margin:0 0 6px}.box ul{margin:0;padding-left:16px}
.lead aside{display:flex;flex-direction:column}.fill{flex:1 1 0;min-height:0;position:relative;overflow:hidden;margin-top:6px}.fill img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cols .box{break-inside:auto}
.pull{font:italic 700 22px/1.25 "Libre Baskerville",serif;border-top:3px solid var(--rule);border-bottom:1px solid var(--rule);padding:10px 2px;margin:16px 0}
.pull small{display:block;font:500 11px Oswald,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px;font-style:normal}
.brief{border-top:2px solid var(--rule);padding-top:10px;margin-top:4px;font-size:12.5px;line-height:1.5}
.brief b{font:700 12px Oswald,sans-serif;letter-spacing:.12em;text-transform:uppercase;margin-right:6px}
.foot{margin-top:14px;border-top:4px double var(--rule);padding-top:6px;text-align:center;font:500 11px Oswald,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
@media(max-width:800px){.sheet{padding:16px;margin:0}.lead{grid-template-columns:1fr}.cols{column-count:1}}
@media print{body{background:#fff}.bar{display:none}.sheet{box-shadow:none;margin:0;max-width:none}.sheet+.sheet{break-before:page}body.single .sheet{display:none}body.single .sheet.cur{display:block}}
</style>
</head>

  <section class="lead"><div class="body">
    <p class="kicker">${L.k}</p><h2>${L.h}</h2><p class="deck">${L.d}</p>
    <p class="by">From our correspondents</p>${L.b.map(p=>`<p>${p}</p>`).join("")}</div>
    <aside>${fig(L.img,L.cap)}<blockquote class="pull" style="margin-left:0;margin-right:0">${PULL[i][0]}<small>${PULL[i][1]}</small></blockquote><div class="box"><h4>At a Glance</h4>${P.facts.map(f=>`<p><b>${f[0]}</b><br>${f[1]}</p>`).join("")}</div><div class="box"><h4>Timeline</h4><ul>${P.tl.map(t=>`<li>${t}</li>`).join("")}</ul></div><figure class="fill"><img src="img/${FILL[i]}.jpg" alt=""></figure></aside></section>
  <section class="cols">${S.map(s=>`<div class="story"><p class="kicker">${s.k}</p>${fig(s.img,s.cap)}<h3>${s.h}</h3><p>${s.t}</p></div>`).join("")}
  <div class="box"><h4>Our View</h4><p><b>${P.ed[0]}</b></p><p>${P.ed[1]}</p></div>
  </section>
  <div class="brief"><b>In Brief</b> ${P.brief.replace(/^Briefs · /,"")}</div>
  <footer class="foot">Greenland Times · Price: ৳ 10.00 (Taka) · Printed at the Capital Press</footer></article>`;
}
function render(){
  mount.innerHTML=PAPERS.map(paper).join("");
  mount.querySelectorAll(".sheet").forEach((e,i)=>{e.style.display=i===cur?"block":"none";e.classList.toggle("cur",i===cur)});
  mount.querySelectorAll(".fill").forEach(f=>{if(f.offsetHeight<90)f.remove()});
  bar.innerHTML=PAPERS.map((p,i)=>`<button class="${i===cur?"on":""}" data-i="${i}">Edition ${i+1} · ${p.date.split(", ")[1].replace(" 2026","")}</button>`).join("")
   +`<button class="gen" data-g="1">Generate new issue</button><button data-pr="1">Print / PDF</button>`;
}
bar.onclick=e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.i)cur=+b.dataset.i;
  if(b.dataset.pr){document.body.classList.add("single");print();document.body.classList.remove("single");return}
  render();scrollTo(0,0)};
render();
</script>
</body>
</html>
